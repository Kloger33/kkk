<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stopColor="#0F766E"/>
      <stop offset="1" stopColor="#042F2E"/>
    </linearGradient>
    <linearGradient id="goldPetal" x1="32" y1="12" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop stopColor="#FDE68A"/>
      <stop offset="0.45" stopColor="#D4A017"/>
      <stop offset="1" stopColor="#92400E"/>
    </linearGradient>
    <linearGradient id="softGold" x1="32" y1="16" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop stopColor="#FEF3C7"/>
      <stop offset="1" stopColor="#D4A017"/>
    </linearGradient>
    <filter id="lotusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F766E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="1.5" fill="none"/>

  <!-- Lotus Group -->
  <g filter="url(#lotusGlow)">
    <!-- Base Pedestal / Lotus Leaf Base -->
    <path d="M20 47 C26 49 38 49 44 47 C42 50 22 50 20 47 Z" fill="#FDE68A" opacity="0.9"/>
    
    <!-- Outer Flaring Left Petal -->
    <path d="M32 38 C23 38 15 32 17 23 C22 23 27 28 32 38 Z" fill="url(#goldPetal)" opacity="0.85"/>
    
    <!-- Outer Flaring Right Petal -->
    <path d="M32 38 C41 38 49 32 47 23 C42 23 37 28 32 38 Z" fill="url(#goldPetal)" opacity="0.85"/>
    
    <!-- Mid Left Petal -->
    <path d="M32 42 C24 38 22 27 25 18 C28 24 30 32 32 42 Z" fill="url(#goldPetal)" opacity="0.95"/>
    
    <!-- Mid Right Petal -->
    <path d="M32 42 C40 38 42 27 39 18 C36 24 34 32 32 42 Z" fill="url(#goldPetal)" opacity="0.95"/>
    
    <!-- Central Sacred Lotus Bud (Kbach Flame) -->
    <path d="M32 10 C32 10 37.5 21 37.5 30 C37.5 37 35 43 32 45 C29 43 26.5 37 26.5 30 C26.5 21 32 10 32 10 Z" fill="url(#softGold)"/>

    <!-- Center Core Highlight Spark -->
    <circle cx="32" cy="27" r="1.75" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
